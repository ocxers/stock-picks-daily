<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Short-Term Stock Picks</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Daily Short-Term Picks</h1>
            <p>Initial Capital: $1,000 per pick | Strategy: Momentum & Volatility</p>
        </header>

        <section id="current-picks" class="card">
            <h2>Today's Picks (<span id="today-date"></span>)</h2>
            <div id="picks-container" class="stock-grid">
                <!-- Picks will be injected here -->
            </div>
        </section>

        <section id="history" class="card">
            <h2>Yesterday's Review</h2>
            <div id="history-container" class="stock-list">
                <!-- History will be injected here -->
            </div>
        </section>

        <footer>
            <p>Generated by Hermes Agent AI | Data via Yahoo Finance</p>
            <p><em>Disclaimer: This is for educational purposes only. Not financial advice.</em></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
